name: CI (updated-version)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test backend (payments, ledger, rides, auth)
        working-directory: updated-version/backend
        run: npm test
      - name: Fare contract vectors are up to date
        working-directory: updated-version/backend
        run: |
          npm run gen:fare-vectors
          git diff --exit-code ../contracts/fare-test-vectors.json

  android:
    name: Android build, tests, lint, release verification
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: updated-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # used by the end-to-end test that starts the test backend
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Secret scan (source)
        run: python3 scripts/secret_scan.py

      - name: Unit, integration, end-to-end and UI (Robolectric) tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: UI regression screenshots
        run: ./gradlew :app:verifyRoborazziDebug

      - name: Lint
        run: ./gradlew :app:lintDebug :app:lintRelease

      - name: Release build (R8) + AAB
        # No production secrets are needed to compile; the release config guard rejects test providers.
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Secret scan (built APK/AAB)
        run: python3 scripts/secret_scan.py app/build/outputs

      - name: Release APK must not contain test/debug code
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          unzip -p "$APK" 'classes*.dex' > /tmp/dex.bin
          if grep -a -q "TestGatewayCheckout\|payments/test/checkout\|HttpLoggingInterceptor" /tmp/dex.bin; then
            echo "Release APK contains test gateway or debug logging code"; exit 1
          fi

      - name: Dependency vulnerability report
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            updated-version/app/build/reports
            updated-version/app/build/outputs/roborazzi
          retention-days: 7

  # Play Store upload is intentionally NOT automated. Add a separate, manually-triggered workflow
  # with protected environment secrets (signing key, service account) when credentials exist.
